name: 缠论日报

on:
  # 定时：周一到周五，UTC 01:00=北京09:00开盘前；UTC 08:00=北京16:00收盘后
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: chan-daily
  cancel-in-progress: false

permissions:
  contents: write   # 允许把报告与K线图提交回仓库

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 随机延迟（避开固定时间拥堵）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖与中文字体
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -y
          sudo apt-get install -y fonts-wqy-zenhei
          pip install --quiet akshare yfinance "pandas>=2.0,<3" "numpy<3" matplotlib requests markdown2 python-dotenv

      - name: 运行缠论批量分析+绘图+发邮件
        env:
          TZ: Asia/Shanghai
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME || '股票分析助手' }}
        run: python chan_analysis.py

      - name: 提交报告与K线图回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chan_report.md chan_img/
          git commit -m "自动更新缠论日报与配图" || echo "无新内容无需提交"
          git push
