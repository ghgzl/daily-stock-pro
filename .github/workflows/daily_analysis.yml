name: 缠论日报

on:
  # 定时：周一到周五，UTC 01:00=北京09:00开盘前；UTC 08:00=北京16:00收盘后
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: chan-daily
  cancel-in-progress: false

permissions:
  contents: write   # 允许把报告与K线图提交回仓库

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 随机延迟（避开固定时间拥堵）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖与中文字体
        run: |
          python -m pip install --upgrade pip
          # 依赖先行：即使字体装不上，报告与邮件也要能跑
          pip install --quiet akshare yfinance "pandas>=2.0,<3" "numpy<3" matplotlib requests markdown2 python-dotenv
          # 中文字体 best-effort：先用 apt，apt 不可用（如 runner DNS 抖动）则直接下载字体文件
          if [ -z "$(fc-list :lang=zh 2>/dev/null)" ]; then
            sudo apt-get update -y || echo "apt update 失败，跳过"
            sudo apt-get install -y fonts-wqy-zenhei || echo "apt 安装字体失败，改用备用字体"
          fi
          if [ -z "$(fc-list :lang=zh 2>/dev/null)" ]; then
            mkdir -p "$HOME/.fonts"
            curl -fsSL --retry 3 --max-time 180 -o "$HOME/.fonts/SimHei.ttf" \
              https://raw.githubusercontent.com/StellarCN/scp_zh/master/fonts/SimHei.ttf || echo "备用字体下载失败"
            fc-cache -f "$HOME/.fonts" || true
          fi
          rm -rf "$HOME/.cache/matplotlib"
          fc-list :lang=zh | head -3 || echo "无中文字体，图表中文可能显示为方块（不影响报告与邮件）"

      - name: 运行缠论批量分析+绘图+发邮件
        env:
          TZ: Asia/Shanghai
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME || '股票分析助手' }}
        run: python chan_analysis.py

      - name: 提交报告与K线图回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chan_report.md chan_img/
          git commit -m "自动更新缠论日报与配图" || echo "无新内容无需提交"
          git push
